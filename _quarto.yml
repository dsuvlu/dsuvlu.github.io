project:
  type: website
  output-dir: _site
  # Files Quarto's link scan misses: fonts are only referenced from CSS (and
  # the OFL requires the licence to travel with them); <video poster> is not
  # an attribute Quarto looks at.
  resources:
    - assets/fonts/*.woff2
    - assets/fonts/OFL-*.txt
    - assets/video/*
    # module scripts import each other, which the link scan doesn't follow
    - assets/ising*.js
    - assets/portraits/*.jpg
  post-render: _scripts/post-render.py

website:
  title: "Dylan Suvlu"
  site-url: https://dsuvlu.github.io
  description: "Computational scientist working across chemistry, statistical physics, and machine learning."
  repo-url: https://github.com/dsuvlu/dsuvlu.github.io
  favicon: assets/favicon.svg
  navbar:
    background: light
    pinned: true
    left:
      - href: about/index.qmd
        text: About
      - text: Research
        menu:
          - href: publications.qmd
            text: Publications
          - href: projects/index.qmd
            text: Selected projects
          - href: software/index.qmd
            text: Research software
          - href: talks/index.qmd
            text: Talks
      - href: demos/index.qmd
        text: Demos
      - href: blog/index.qmd
        text: Notes
      - href: cv.qmd
        text: CV
    right:
      - text: "{{< ai google-scholar >}}"
        aria-label: Google Scholar
        href: https://scholar.google.com/citations?user=aLT9gJ0AAAAJ&hl=en&oi=ao
      - icon: github
        aria-label: GitHub
        href: https://github.com/dsuvlu
      - text: "{{< ai orcid >}}"
        aria-label: ORCID
        href: https://orcid.org/0000-0003-3216-1338
      - icon: envelope
        aria-label: Email
        href: mailto:dsuvlu@gmail.com
      - icon: rss
        aria-label: RSS
        href: blog/index.xml
  page-footer:
    # Quarto has no template variable for the year; update this each January.
    left: "© 2026 Dylan Suvlu"
    right:
      - text: "CC BY 4.0"
        href: https://creativecommons.org/licenses/by/4.0/
  search:
    location: navbar
    type: overlay
  twitter-card:
    image: assets/social-preview.jpg
    card-style: summary_large_image
  open-graph:
    image: assets/social-preview.jpg
    locale: en_US

filters:
  - _extensions/seo/seo.lua

format:
  html:
    theme:
      light: default
      dark: [default, assets/dark.scss]
    css: assets/styles.css
    smooth-scroll: true
    # consumed by _extensions/seo/seo.lua; keep in step with website.site-url
    canonical-base: https://dsuvlu.github.io
    # Fonts are self-hosted (@font-face in assets/styles.css). Preload the two
    # latin faces every page paints with so text doesn't flash in a fallback.
    # Root-absolute paths are fine: this is a user site served from /.
    include-in-header:
      - text: |
          <link rel="preload" href="/assets/fonts/gelasio-latin.woff2" as="font" type="font/woff2" crossorigin>
          <link rel="preload" href="/assets/fonts/mulish-latin.woff2" as="font" type="font/woff2" crossorigin>
